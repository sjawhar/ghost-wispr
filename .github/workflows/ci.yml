name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # The Ubuntu mirror a runner gets can be slow: twice the 71.5 MB of packages below took
      # longer than the install's 10 minutes, at about 100 kB/s. apt downloads them into a
      # directory the job caches after every install, also one that timed out, so each run
      # downloads only what the cache lacks. A new runner image starts from the last image's
      # packages; after an install, the cache keeps only the archives of the installed versions.
      # A mirror can also be down for a while (run 44521681804): apt-get update could reach no
      # mirror, only warned, and left the image's old lists, which named an archive the archive
      # had since deleted; the install asked every mirror for it and exited 100. The runner image
      # limits apt on purpose, so that a stalled mirror fails over fast (runner-images#14594):
      # Acquire::Retries "1" in its zz-retries file gives the first mirror 2 tries and each later
      # mirror 1, and each wait for a server up to 15 s, so one try of a file can take longer
      # (49 s in that run). The step keeps that, and instead runs update and the install again,
      # from the first mirror: 3 tries in all.
      - name: Name the apt package cache
        id: apt-key
        run: |
          echo "image=apt-$ImageOS-$ImageVersion-ffmpeg-portaudio19-dev-pulseaudio" >>"$GITHUB_OUTPUT"
          echo "os=apt-$ImageOS-" >>"$GITHUB_OUTPUT"

      - name: Restore the apt package cache
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          # A save names what it holds after the image key, so the newest save for the image wins.
          key: ${{ steps.apt-key.outputs.image }}
          restore-keys: |
            ${{ steps.apt-key.outputs.image }}-
            ${{ steps.apt-key.outputs.os }}

      - name: Install system dependencies
        id: apt-install
        timeout-minutes: 10
        run: |
          archives="$HOME/apt-archives"
          mkdir -p "$archives/partial"
          # $HOME is closed to other users, so apt's _apt user could not reach this directory and
          # apt would download as root, outside its sandbox.
          sudo chmod o+x "$HOME"
          apt_get=(sudo DEBIAN_FRONTEND=noninteractive apt-get -o Dir::Cache::Archives="$archives")
          # Each try runs apt-get update, then the install; a failed try runs again 25 s later, up
          # to 3 tries, and no new try starts once the step has run 360 s (so the last starts by
          # 385 s). The first try is what the step ran before: an update that cannot fetch an index
          # only warns, and the install from the lists it kept passes if the cache holds what they
          # name.
          for try in 1 2 3; do
            "${apt_get[@]}" update &&
              "${apt_get[@]}" install -y --no-install-recommends ffmpeg portaudio19-dev pulseaudio &&
              break
            if ((try == 3 || SECONDS > 360)); then
              exit 1
            fi
            echo "::warning::apt-get: try $try failed; trying again in 25 s"
            sleep 25
          done
          # apt-get autoclean skips archives named for a CPU variant (*_amd64v3.deb), so it keeps
          # every outdated one. Keep only the archives of the versions now installed.
          installed=$(dpkg-query -W -f='${Package}_${Version}\n' | sed 's/:/%3a/g')
          for deb in "$archives"/*.deb; do
            name=${deb##*/}
            grep -qxF "${name%_*}" <<<"$installed" || sudo rm -f "$deb"
          done

      # Runs after an install that failed or timed out too, so what it downloaded is kept.
      - name: List the apt package cache
        id: apt-contents
        if: ${{ !cancelled() && steps.apt-install.outcome != 'skipped' }}
        env:
          IMAGE_KEY: ${{ steps.apt-key.outputs.image }}
        run: |
          archives="$HOME/apt-archives"
          sudo chown -R "$(id -u):$(id -g)" "$archives"
          echo "$(find "$archives" -maxdepth 1 -name '*.deb' | wc -l) packages in the apt cache"
          sum=$(cd "$archives" && find . -type f -printf '%P %s\n' | sort | sha256sum | cut -c1-16)
          echo "key=$IMAGE_KEY-$sum" >>"$GITHUB_OUTPUT"

      # Saved before the tests, so a run whose tests fail still keeps the packages. An unchanged
      # cache is not saved again.
      - name: Save the apt package cache
        if: ${{ !cancelled() && steps.apt-contents.outputs.key != '' && steps.apt-contents.outputs.key != steps.apt-cache.outputs.cache-matched-key }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-contents.outputs.key }}

      # PortAudio's PulseAudio host API fails to initialize without a sound server, and then
      # internal/audio's mic reopen test fails before it reaches the open failure it checks.
      - name: Start PulseAudio with a null sink
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl info

      - name: Create embed placeholder
        run: mkdir -p cmd/ghost-wispr/static && touch cmd/ghost-wispr/static/.gitkeep

      # The paused listener's spotter: sherpa-onnx's static libraries and its keyword model, which a
      # build with -tags kws links and embeds (deploy/sherpa/fetch.sh, which checks each download's
      # pinned sha256). Lint and the tests build with it, so it comes first; the cache keeps the
      # downloads, keyed on the script that pins them.
      - name: Restore the sherpa-onnx downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ghost-wispr-sherpa
          key: sherpa-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deploy/sherpa/fetch.sh') }}

      - name: Fetch the paused listener's spotter
        timeout-minutes: 10
        run: bash deploy/sherpa/fetch.sh

      # .golangci.yml lints the build with the listener (-tags kws), the one the Pi runs.
      - name: Lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.10

      - name: Format
        run: golangci-lint fmt ./... --diff

      # A build without the listener is the two-state machine, and must still build and vet.
      - name: Vet the build without the listener
        run: go vet ./...

      - name: Test
        run: go test -race -tags kws ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Type check
        run: npm run check

      - name: Test
        run: npm run test

  slice3-acceptance:
    name: Slice 3 acceptance driver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # accept_voice_test.sh builds deploy/pi/journalrecords, the logger of its fake journal.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Install jq
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends jq

      - name: Test
        timeout-minutes: 15
        run: bash deploy/pi/accept_slice3_test.sh

      - name: Deploy script tests
        timeout-minutes: 10
        run: |
          # provision.sh stages the bundle in the service user's runtime directory.
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 "/run/user/$(id -u)"
          for test in deploy/pi/provision_bundle_test.sh deploy/pi/provision_run_test.sh \
            deploy/pi/provision_models_test.sh deploy/pi/update_test.sh deploy/pi/release_publish_test.sh \
            deploy/pi/accept_slice2_test.sh deploy/pi/workflow_pins_test.sh deploy/pi/claim_tailnet_name_test.sh \
            deploy/pi/accept_slice1_test.sh deploy/pi/wait_for_time_sync_test.sh deploy/pi/recording_times_test.sh \
            deploy/pi/accept_voice_test.sh deploy/pi/rollout_test.sh; do
            bash "$test"
          done
