name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # The Ubuntu mirror a runner gets can be slow: twice the 71.5 MB of archives below took
      # longer than the install's 10 minutes, at about 100 kB/s. The packages apt downloads are
      # cached per runner image, and a new image starts from the last image's, so a run
      # downloads only what the archive changed since.
      - name: Read the runner image
        id: image
        run: |
          echo "os=$ImageOS" >>"$GITHUB_OUTPUT"
          echo "version=$ImageVersion" >>"$GITHUB_OUTPUT"

      - name: Restore the apt package cache
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ steps.image.outputs.os }}-${{ steps.image.outputs.version }}-ffmpeg-portaudio19-dev-pulseaudio
          restore-keys: apt-${{ steps.image.outputs.os }}-

      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          archives="$HOME/apt-archives"
          mkdir -p "$archives/partial"
          apt_get=(sudo DEBIAN_FRONTEND=noninteractive apt-get -o Dir::Cache::Archives="$archives")
          "${apt_get[@]}" update
          "${apt_get[@]}" install -y --no-install-recommends ffmpeg portaudio19-dev pulseaudio
          # Keep only packages the archive still has, so the cache does not grow.
          "${apt_get[@]}" autoclean
          sudo chown -R "$(id -u):$(id -g)" "$archives"
          echo "$(find "$archives" -maxdepth 1 -name '*.deb' | wc -l) packages in the apt cache"

      # Saved before the tests, so a run whose tests fail still keeps the packages.
      - name: Save the apt package cache
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      # PortAudio's PulseAudio host API fails to initialize without a sound server, and then
      # internal/audio's mic reopen test fails before it reaches the open failure it checks.
      - name: Start PulseAudio with a null sink
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl info

      - name: Create embed placeholder
        run: mkdir -p cmd/ghost-wispr/static && touch cmd/ghost-wispr/static/.gitkeep

      - name: Lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.10

      - name: Format
        run: golangci-lint fmt ./... --diff

      - name: Test
        run: go test -race ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Type check
        run: npm run check

      - name: Test
        run: npm run test

  slice3-acceptance:
    name: Slice 3 acceptance driver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install jq
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends jq

      - name: Test
        timeout-minutes: 15
        run: bash deploy/pi/accept_slice3_test.sh

      - name: Deploy script tests
        timeout-minutes: 10
        run: |
          # provision.sh stages the bundle in the service user's runtime directory.
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 "/run/user/$(id -u)"
          for test in deploy/pi/provision_bundle_test.sh deploy/pi/provision_run_test.sh \
            deploy/pi/provision_models_test.sh deploy/pi/update_test.sh deploy/pi/release_publish_test.sh \
            deploy/pi/accept_slice2_test.sh deploy/pi/workflow_pins_test.sh deploy/pi/claim_tailnet_name_test.sh \
            deploy/pi/accept_slice1_test.sh deploy/pi/wait_for_time_sync_test.sh; do
            bash "$test"
          done
