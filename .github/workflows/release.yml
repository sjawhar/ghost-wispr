name: Release

on:
  pull_request:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The same apt package cache as CI's Go job (ci.yml), which says why; copied, since the pin
      # test (deploy/pi/workflow_pins_test.sh) admits no local composite action. This install
      # timed out six times on 2026-11-11. This runner image gets packages from ports.ubuntu.com
      # alone, with no mirror to fail over to, and keeps apt's 3 retries of 30 s: 5 retries give a
      # host that answers 503 for a while 31 s of growing pauses to recover, not 7 s.
      - name: Name the apt package cache
        id: apt-key
        run: |
          echo "image=apt-release-$ImageOS-$RUNNER_ARCH-$ImageVersion-ffmpeg-portaudio19-dev" >>"$GITHUB_OUTPUT"
          echo "os=apt-release-$ImageOS-$RUNNER_ARCH-" >>"$GITHUB_OUTPUT"

      - name: Restore the apt package cache
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-key.outputs.image }}
          restore-keys: |
            ${{ steps.apt-key.outputs.image }}-
            ${{ steps.apt-key.outputs.os }}

      - name: Install audio build dependencies
        id: apt-install
        timeout-minutes: 10
        run: |
          archives="$HOME/apt-archives"
          mkdir -p "$archives/partial"
          sudo chmod o+x "$HOME" # so apt's _apt user reaches the directory, and downloads stay sandboxed
          apt_get=(sudo DEBIAN_FRONTEND=noninteractive apt-get -o Dir::Cache::Archives="$archives"
            -o Acquire::Retries=5)
          "${apt_get[@]}" update
          "${apt_get[@]}" install -y --no-install-recommends ffmpeg portaudio19-dev
          installed=$(dpkg-query -W -f='${Package}_${Version}\n' | sed 's/:/%3a/g')
          for deb in "$archives"/*.deb; do
            name=${deb##*/}
            grep -qxF "${name%_*}" <<<"$installed" || sudo rm -f "$deb"
          done

      - name: List the apt package cache
        id: apt-contents
        if: ${{ !cancelled() && steps.apt-install.outcome != 'skipped' }}
        env:
          IMAGE_KEY: ${{ steps.apt-key.outputs.image }}
        run: |
          archives="$HOME/apt-archives"
          sudo chown -R "$(id -u):$(id -g)" "$archives"
          echo "$(find "$archives" -maxdepth 1 -name '*.deb' | wc -l) packages in the apt cache"
          sum=$(cd "$archives" && find . -type f -printf '%P %s\n' | sort | sha256sum | cut -c1-16)
          echo "key=$IMAGE_KEY-$sum" >>"$GITHUB_OUTPUT"

      - name: Save the apt package cache
        if: ${{ !cancelled() && steps.apt-contents.outputs.key != '' && steps.apt-contents.outputs.key != steps.apt-cache.outputs.cache-matched-key }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-contents.outputs.key }}

      - name: Build web assets
        working-directory: web
        run: npm ci && npm run build

      - name: Embed web assets
        run: make --silent embed-assets

      # The paused listener's spotter for linux/arm64, linked statically into the binary with its
      # model embedded, so the release stays one file (deploy/sherpa/fetch.sh checks each pinned
      # sha256). The cache is CI's, keyed by architecture.
      - name: Restore the sherpa-onnx downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ghost-wispr-sherpa
          key: sherpa-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deploy/sherpa/fetch.sh') }}

      - name: Fetch the paused listener's spotter
        timeout-minutes: 10
        run: bash deploy/sherpa/fetch.sh arm64

      - name: Build arm64 binary
        env:
          BUILD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          go build -tags kws \
            -ldflags "-X main.Commit=${BUILD_SHA} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o ghost-wispr-linux-arm64 \
            ./cmd/ghost-wispr
          sha256sum ghost-wispr-linux-arm64 > ghost-wispr-linux-arm64.sha256

      # The binary itself, on arm64: its spotter links, loads the embedded model, hears the stored
      # start phrases and none of the stored near misses, and its CPU per second of audio, one thread.
      - name: Self-test the paused listener
        run: |
          ls -l ghost-wispr-linux-arm64
          ldd ghost-wispr-linux-arm64
          ./ghost-wispr-linux-arm64 kws-selftest internal/wake/local/testdata/*.wav

      # The Pi's deploy set (dispatch://INFRA-5935/spec R5): the files the nightly update installs
      # with this binary, the provisioning files, and a manifest that names this commit, this
      # binary's SHA-256 and the link versions this binary accepts. The build asks the binary, so it
      # runs here, on arm64, after the self-test.
      - name: Build the Pi's deploy tarball
        env:
          BUILD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          # deploy-tarball-command:start
          bash deploy/pi/build-deploy-tarball.sh "$BUILD_SHA" ./ghost-wispr-linux-arm64 .
          # deploy-tarball-command:end

      - name: Upload arm64 artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ghost-wispr-linux-arm64
          path: |
            ghost-wispr-linux-arm64
            ghost-wispr-linux-arm64.sha256
            ghost-wispr-pi-deploy.tar.gz
            ghost-wispr-pi-deploy.tar.gz.sha256
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error

  # The call bridge's two images (dispatch://INFRA-5904): ghost-wispr-bridge, the release build, and
  # ghost-wispr-bridge-test, the callfault build that the test pool runs. Each run builds both from
  # deploy/bridge/Dockerfile, and the workflow_run of main pushes both to ghcr.io with the release's
  # tag. This job names that tag, once: the publish job needs this job, so a release exists only once
  # both its images do, and creates the release with this job's tag, so jobs that run on either side
  # of midnight UTC give the release and its images one tag (deploy/bridge/release_images_test.sh).
  bridge-images:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Name the release
        id: tag
        env:
          BUILD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          # release-tag-command:start
          echo "tag=v$(date -u +%Y.%m.%d)-${BUILD_SHA:0:7}" >>"$GITHUB_OUTPUT"
          # release-tag-command:end

      - name: Build the bridge's images
        env:
          BUILD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # bridge-images-build-command:start
          images=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}
          labels=(--label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            --label "org.opencontainers.image.revision=$BUILD_SHA")
          docker build --file deploy/bridge/Dockerfile --platform linux/amd64 "${labels[@]}" \
            --tag "$images/ghost-wispr-bridge:$TAG" .
          docker build --file deploy/bridge/Dockerfile --platform linux/amd64 "${labels[@]}" \
            --build-arg BUILD_TAGS=callfault --tag "$images/ghost-wispr-bridge-test:$TAG" .
          # bridge-images-build-command:end

      - name: Push the bridge's images
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # bridge-images-push-command:start
          images=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"
          docker push "$images/ghost-wispr-bridge:$TAG"
          docker push "$images/ghost-wispr-bridge-test:$TAG"
          # bridge-images-push-command:end

  publish:
    needs: [release, bridge-images]
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ghost-wispr-linux-arm64

      - name: Publish release
        env:
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.bridge-images.outputs.tag }}
        run: |
          # release-publish-command:start
          gh release create "$TAG" \
            ghost-wispr-linux-arm64 \
            ghost-wispr-linux-arm64.sha256 \
            ghost-wispr-pi-deploy.tar.gz \
            ghost-wispr-pi-deploy.tar.gz.sha256 \
            THIRD_PARTY_NOTICES.md \
            --target "$BUILD_SHA" \
            --title "$TAG" \
            --generate-notes
          # release-publish-command:end
