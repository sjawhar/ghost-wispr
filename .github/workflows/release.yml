name: Release

on:
  pull_request:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The same apt package cache as CI's Go job (ci.yml), which says why; copied, since the pin
      # test (deploy/pi/workflow_pins_test.sh) admits no local composite action. This install
      # timed out six times on 2026-11-11. This runner image gets packages from ports.ubuntu.com
      # alone, with no mirror to fail over to, and keeps apt's 3 retries of 30 s: 5 retries give a
      # host that answers 503 for a while 31 s of growing pauses to recover, not 7 s.
      - name: Name the apt package cache
        id: apt-key
        run: |
          echo "image=apt-release-$ImageOS-$RUNNER_ARCH-$ImageVersion-ffmpeg-portaudio19-dev" >>"$GITHUB_OUTPUT"
          echo "os=apt-release-$ImageOS-$RUNNER_ARCH-" >>"$GITHUB_OUTPUT"

      - name: Restore the apt package cache
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-key.outputs.image }}
          restore-keys: |
            ${{ steps.apt-key.outputs.image }}-
            ${{ steps.apt-key.outputs.os }}

      - name: Install audio build dependencies
        id: apt-install
        timeout-minutes: 10
        run: |
          archives="$HOME/apt-archives"
          mkdir -p "$archives/partial"
          sudo chmod o+x "$HOME" # so apt's _apt user reaches the directory, and downloads stay sandboxed
          apt_get=(sudo DEBIAN_FRONTEND=noninteractive apt-get -o Dir::Cache::Archives="$archives"
            -o Acquire::Retries=5)
          "${apt_get[@]}" update
          "${apt_get[@]}" install -y --no-install-recommends ffmpeg portaudio19-dev
          installed=$(dpkg-query -W -f='${Package}_${Version}\n' | sed 's/:/%3a/g')
          for deb in "$archives"/*.deb; do
            name=${deb##*/}
            grep -qxF "${name%_*}" <<<"$installed" || sudo rm -f "$deb"
          done

      - name: List the apt package cache
        id: apt-contents
        if: ${{ !cancelled() && steps.apt-install.outcome != 'skipped' }}
        env:
          IMAGE_KEY: ${{ steps.apt-key.outputs.image }}
        run: |
          archives="$HOME/apt-archives"
          sudo chown -R "$(id -u):$(id -g)" "$archives"
          echo "$(find "$archives" -maxdepth 1 -name '*.deb' | wc -l) packages in the apt cache"
          sum=$(cd "$archives" && find . -type f -printf '%P %s\n' | sort | sha256sum | cut -c1-16)
          echo "key=$IMAGE_KEY-$sum" >>"$GITHUB_OUTPUT"

      - name: Save the apt package cache
        if: ${{ !cancelled() && steps.apt-contents.outputs.key != '' && steps.apt-contents.outputs.key != steps.apt-cache.outputs.cache-matched-key }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-contents.outputs.key }}

      - name: Build web assets
        working-directory: web
        run: npm ci && npm run build

      - name: Embed web assets
        run: make --silent embed-assets

      - name: Build arm64 binary
        env:
          BUILD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          go build \
            -ldflags "-X main.Commit=${BUILD_SHA} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o ghost-wispr-linux-arm64 \
            ./cmd/ghost-wispr
          sha256sum ghost-wispr-linux-arm64 > ghost-wispr-linux-arm64.sha256

      - name: Upload arm64 artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ghost-wispr-linux-arm64
          path: |
            ghost-wispr-linux-arm64
            ghost-wispr-linux-arm64.sha256
          if-no-files-found: error

  publish:
    needs: release
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ghost-wispr-linux-arm64

      - name: Publish release
        env:
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # release-publish-command:start
          tag="v$(date -u +%Y.%m.%d)-${BUILD_SHA:0:7}"
          gh release create "$tag" \
            ghost-wispr-linux-arm64 \
            ghost-wispr-linux-arm64.sha256 \
            --target "$BUILD_SHA" \
            --title "$tag" \
            --generate-notes
          # release-publish-command:end
