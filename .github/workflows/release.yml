name: Release

on:
  pull_request:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install audio build dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg portaudio19-dev

      - name: Build web assets
        working-directory: web
        run: npm ci && npm run build

      - name: Embed web assets
        run: make --silent embed-assets

      - name: Build arm64 binary
        env:
          BUILD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          go build \
            -ldflags "-X main.Commit=${BUILD_SHA} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o ghost-wispr-linux-arm64 \
            ./cmd/ghost-wispr
          sha256sum ghost-wispr-linux-arm64 > ghost-wispr-linux-arm64.sha256

      - name: Upload arm64 artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ghost-wispr-linux-arm64
          path: |
            ghost-wispr-linux-arm64
            ghost-wispr-linux-arm64.sha256
          if-no-files-found: error

  publish:
    needs: release
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ghost-wispr-linux-arm64

      - name: Publish release
        env:
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # release-publish-command:start
          tag="v$(date -u +%Y.%m.%d)-${BUILD_SHA:0:7}"
          gh release create "$tag" \
            ghost-wispr-linux-arm64 \
            ghost-wispr-linux-arm64.sha256 \
            --target "$BUILD_SHA" \
            --title "$tag" \
            --generate-notes
          # release-publish-command:end
