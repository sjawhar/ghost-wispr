db_path: data/ghost-wispr.db
audio_dir: data/audio
silence_timeout: 300s
# The address tailscale serve publishes (provision.sh TAILSCALE_HOSTNAME): the web UI accepts
# requests from pages there, and Envoy events link to sessions under it.
public_url: https://ghost-wispr.tail12ec1c.ts.net
# The office's recording rules: the web UI shows each under Recording rules, as written here.
recording_rules:
  - Record only while the light is on.
  - Anyone may pause it at any time without a reason.
  - Transcripts are readable by Theorem staff only.
  - A person can ask for a segment to be deleted.
  - Saying "Wispr" asks the voice about our work; a question it sends to an agent leaves the unit, and deleting the segment cannot recall it.
# The Pi's Google identity: workload identity federation for its device certificate. Every provider
# below but Deepgram signs in with it, so the Pi holds no model key but Deepgram's.
google_credentials_file: /opt/ghost-wispr/google-credentials.json
# Each model provider, named once (README "Model providers"); each role below names one as
# provider/model. Moving a role to another provider, such as the gateway, is a change to its
# provider/model here, once that provider serves the model to the Pi.
providers:
  # Theorem's model gateway admits a caller by a Google ID token for its audience whose account is
  # on its list, so the Pi signs in with a token minted from its own identity and needs no gateway
  # key (docs/pi-setup.md, "The model gateway"). It would serve the Pi embeddings only: it has no
  # Gemini chat or speech model, and no route for streaming audio. It refuses the Pi until
  # theorem-labs/agent-infra#5187 is merged and applied, and a provider that refuses reads Fails on
  # the settings page, so the entry stays commented out until then. The switch, then: this entry
  # uncommented, and embedding.model below set to gateway/gemini-embedding-2.
  # gateway:
  #   api: openai
  #   url: https://model-gateway.tail12ec1c.ts.net/v1
  #   auth:
  #     kind: google_id_token
  #     audience: model-gateway-gce
  # Vertex AI in the Pi's Google project, signed in with a Google access token. The Concierge,
  # summaries and search call Gemini here directly. Each generate call here (the Concierge's and
  # the summaries') carries these labels, which Vertex AI copies into Cloud Billing, so the Pi's
  # Gemini spend is attributed to its owner and stream (dispatch://INFRA-1027); search's
  # embeddings carry none.
  vertex:
    api: vertex
    project: theorem-agent-infra
    location: global
    auth:
      kind: google
    labels:
      owner: sjawhar
      stream: agents-no-stream
  # Vertex AI's us multi-region, for text-to-speech: Gemini TTS streams its first audio sooner there
  # than from global. Each speech call carries the same labels.
  vertex-us:
    api: vertex
    project: theorem-agent-infra
    location: us
    auth:
      kind: google
    labels:
      owner: sjawhar
      stream: agents-no-stream
  # OpenAI, for voice B's GPT-Live, which no gateway route carries: the Pi exchanges its Google ID
  # token for an OpenAI access token with these workload identity ids, which are not secrets.
  openai:
    api: openai
    auth:
      kind: openai_wif
      identity_provider_id: idp_b2d6c7c4ac719ef0764eba89
      service_account_id: user-cd72c7d9a1bb41594ed3c6e7
  # Deepgram streams live transcription and runs voice C. Deepgram has no workload identity, so it
  # takes a key: provision.sh writes the credential bundle's deepgram-key into .env under this name.
  deepgram:
    api: deepgram
    auth:
      kind: api_key
      env: GHOST_WISPR_DEEPGRAM_API_KEY
transcription:
  model: deepgram/nova-3
batch_transcription:
  model: deepgram/nova-3
summarization:
  model: vertex/gemini-4-carbon
  # A backlog of sessions is summarized online, one call a session, instead of as a batch job,
  # for two reasons: theorem-agent-infra's deny policy vertex-jobs-fence (agent-infra
  # root/vertexjobfence.go, dispatch://INFRA-3614) refuses every Vertex AI batch job create to
  # every principal, and genai sends Vertex AI no batch of inlined requests anyway.
  batch_jobs: false
embedding:
  # gemini-embedding-2 on Vertex AI at global: the model and location of the vectors the Pi
  # already holds, which search labels gemini-embedding-2 whichever provider serves it, so the
  # deploy embeds no session again. Once theorem-labs/agent-infra#5187 applies, the one-line switch
  # to the gateway is `model: gateway/gemini-embedding-2`, with the gateway entry under providers
  # uncommented (docs/pi-setup.md, "The model gateway").
  model: vertex/gemini-embedding-2
# provision.sh --models <shared-drive-id> adds gdrive_folder_id and turns gdrive_sync_enabled
# and gc_enabled on; GC removes only local audio that Drive holds a copy of.
gdrive_sync_enabled: false
gc_enabled: false
gc_max_age_days: 0
gc_max_audio_size_mb: 20000
speaker_enabled: true
# The speaker and the microphone open only the Jabra Speak2 75, named by its ALSA card id (J75 in
# /proc/asound/cards), not by "Jabra", which a second Jabra device would also match. Another
# capture card, such as the ALSA loopback an injected-audio acceptance run loads (docs/pi-setup.md,
# "Inject speech for acceptance"), is never recorded, and with the Jabra unplugged the light is
# never lit.
speaker_device: J75
mic_device: J75
# Text-to-speech, for voice A and POST /api/tts/speak: Gemini TTS's Kore voice, streamed from
# Vertex AI's us multi-region.
tts:
  model: vertex-us/gemini-3.8-flash-tts
  voice: Kore
indicator_light: blink1
power_button: true
# The Jabra's Mute button pauses and resumes, as the power button does (docs/pi-setup.md, "Pause
# and resume at the unit"). A restart of a paused unit stays paused (defect D9, #75). The office
# Pi's .env can override this line with GHOST_WISPR_JABRA_MUTE_BUTTON; a full provisioner run
# rewrites .env without it.
jabra_mute_button: true
# Envoy events go to the Envoy hub's listener over the tailnet, with no credential (README "Envoy
# events"). The hub is the NATS server pi.env's PI_NATS_SERVER names; its listener answers on 9020.
envoy_enabled: true
envoy_hub_url: http://envoy-hub.tail12ec1c.ts.net:9020
# The meeting voice (README "Meeting voice"): "Wispr, …" at the start of a sentence asks about the
# work in Dispatch. Voice A, text-to-speech, speaks with the provider and model of tts above.
voice:
  enabled: true
  engine: tts
  wake_phrases: [Wispr, Ghost Wispr]
  # The paused listener ("Wispr, start recording" while paused) stays off until its false starts
  # are measured below 0.5 an hour on 10 h of speech, with both of the measurement's controls fired
  # (dispatch://INFRA-4627).
  paused_listener: false
  # Voice B, picked on the settings page: OpenAI's GPT-Live, signed in by OpenAI workload identity.
  gptlive:
    model: openai/gpt-live-1
  # Voice C, a voice agent, picked on the settings page: Deepgram's Voice Agent, with the Deepgram key.
  dgagent:
    provider: deepgram
# The Concierge answers on Gemini on Vertex AI. It reads Dispatch with the Pi's own no-scope token
# (GHOST_WISPR_DISPATCH_TOKEN, the credential bundle's dispatch-token) and asks an issue's agent
# through the Envoy listener.
concierge:
  model: vertex/gemini-3.5-flash-lite
  dispatch_url: https://dispatch.tail12ec1c.ts.net
  envoy_url: http://envoy-hub.tail12ec1c.ts.net:9020
