# Ghost Wispr's journald setting for the office Pi. The nightly update (deploy/pi/update.sh)
# installs it as /etc/systemd/journald.conf.d/90-ghost-wispr.conf, restarts journald when it
# changed, and moves the boot's journal from /run to the card (journalctl --flush).
#
# systemd reads the drop-ins of /etc, /run and /usr/lib/systemd/journald.conf.d/ in the order of
# their file names, and a later value wins. Raspberry Pi OS's raspberrypi-sys-mods ships
# 40-rpi-volatile-storage.conf with Storage=volatile, which keeps the journal in /run and loses it
# at each reboot; 90- sorts after it. check 8 of deploy/pi/check-deploy.sh fails when another file
# overrides a value here.
[Journal]
# Keep the journal on the card, in /var/log/journal, across reboots.
Storage=persistent
# One journal: ghost-wispr's user units log to the system journal, as they did with volatile
# storage, so sudo journalctl _SYSTEMD_USER_UNIT=... reads them as before.
SplitMode=none
# At most 1 GiB of the 58 GiB card: about seven months at the rate the Pi's journal grew from
# 2026-11-24 09:49 to 11-27 15:50 PST, to 16 MiB. journald also leaves 5 GiB of the card free for the
# recordings, and deletes its oldest file first to keep both.
SystemMaxUse=1G
SystemKeepFree=5G
# Files of 64 MiB, so a deletion frees a small step of the cap.
SystemMaxFileSize=64M
# journald's default, written out: the journal goes to the card every 5 minutes, and at once for a
# line of priority crit or worse. A longer interval writes the card less but loses more of the lines
# before a power cut, which are the lines a reboot is read for.
SyncIntervalSec=5m
